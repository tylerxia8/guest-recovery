<header><span class="brand"><span class="brand-symbol" aria-hidden="true">L</span><span class="brand-wordmark">Lucena<small>Guest Messages</small></span></span></header>
<main id="main-content" tabindex="-1" class="login-main"><section class="detail-card"><p class="eyebrow">Manager workspace</p><h1 id="login-title">Sign in</h1><p id="login-description">Use your manager username and password.</p><!-- operations-login --><form id="login-form"><label>Username<input name="username" required minlength="3" maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label>Password<input name="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password"></label><label id="confirm-label" hidden>Confirm password<input name="confirm_password" type="password" maxlength="256" autocomplete="new-password"></label><button id="sign-in" disabled>Sign in</button><p id="login-feedback" role="status"></p></form></section></main>
