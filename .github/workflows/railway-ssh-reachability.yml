name: Railway migration recovery
on:
  push:
    branches: [railway-recovery-check]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - run: |
          umask 077
          ssh-keygen -q -t ed25519 -N '' -C "cleaner-migration-recovery-${GITHUB_RUN_ID}" -f "$RUNNER_TEMP/recovery"
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-public-key
          path: ${{ runner.temp }}/recovery.pub
          retention-days: 1
      - name: Retrieve and encrypt the authorized migration only
        env:
          KNOWN: '["0009_cleaner_inputs","0012_standard_cleaning_time","0018_workspace_isolation","0020_workspace_connections","0019_workspace_accounts","0017_offer_emails","0021_onboarding_emails","0028_guest_touchups","0029_stay_times","0014_automatic_email","0016_cleaning_offers","0032_account_workspaces","0024_manager_mfa","0027_submitting_at","0031_action_inbox_claims","0010_default_eligibility","0015_email_delivery_permissions","0025_account_deletion","0013_cleaner_email","0008_weekly_hours","0030_manager_invitations","0022_cleaner_reading_languages","0023_cleaner_preferred_language","0026_confirmed_checkout","0011_cleaner_onboarding"]'
          TARGET: 49a04266-437f-4f51-8e58-0af78a967856@ssh.railway.com
        run: |
          set -eu
          umask 077
          trap 'rm -f "$RUNNER_TEMP/recovery" "$RUNNER_TEMP/migration.py"' EXIT
          for attempt in $(seq 1 36); do
            
            known_b64=$(printf '%s' "$KNOWN" | base64 -w0)
            remote="python -c 'import base64; exec(base64.b64decode(\"$script\"))' '$known_b64'"
            if ssh -nT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -i "$RUNNER_TEMP/recovery" "$TARGET" "$remote" > "$RUNNER_TEMP/migration.py" 2>"$RUNNER_TEMP/recovery-error"; then
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["base"] and "0028_cleaner_returns" in d["migrations"]' "$RUNNER_TEMP/migration.py" 2>/dev/null; then
                openssl cms -encrypt -aes256 -binary -in "$RUNNER_TEMP/migration.py" -outform DER -out "$RUNNER_TEMP/migration.der" .github/railway-recovery-recipient.pem
                exit 0
              fi
            fi
            sleep 7
          done
          tail -4 "$RUNNER_TEMP/recovery-error" >&2
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-cleaner-migration
          path: ${{ runner.temp }}/migration.der
          retention-days: 1
