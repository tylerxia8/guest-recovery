name: Guest Recovery CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: guest-recovery

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: find web -name '*.js' -exec node --check {} +
