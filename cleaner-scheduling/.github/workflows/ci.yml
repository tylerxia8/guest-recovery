name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleaning_migrator
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: cleaning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleaning_migrator -d cleaning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      OPERATIONAL_TIMEZONE: America/New_York
      RESERVATION_PROVIDER: mock
      SMS_PROVIDER: mock
      ROUTING_PROVIDER: mock
      AUTH_PROVIDER: mock
      PRODUCTION_INTEGRATIONS_ENABLED: "false"
      PRODUCTION_DISPATCH_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://cleaning_app:local-dev-only@127.0.0.1:5432/cleaning
      MIGRATION_DATABASE_URL: postgresql+psycopg://cleaning_migrator:local-dev-only@127.0.0.1:5432/cleaning
      REDIS_URL: redis://127.0.0.1:6379/1
      AUTH_ISSUER: http://localhost/mock-issuer
      AUTH_AUDIENCE: cleaning-local
      AUTH_MOCK_SECRET: test-only-mock-secret-not-a-credential
      POLICY_APPROVAL_REQUIRED: "true"
      CORS_ORIGINS: http://127.0.0.1:3000
      HOSPITABLE_CREDENTIAL_SECRET_REF: ""
      HOSPITABLE_WEBHOOK_SECRET_REF: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_MESSAGING_SERVICE_SID: ""
      GOOGLE_MAPS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install dependencies
        working-directory: backend
        run: ~/.local/bin/uv sync --frozen --all-groups
      - name: Create application role
        run: |
          PGPASSWORD=local-dev-only psql -h 127.0.0.1 -U cleaning_migrator -d cleaning -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cleaning_app') THEN CREATE ROLE cleaning_app LOGIN PASSWORD 'local-dev-only'; END IF; END \$\$;"
          PGPASSWORD=local-dev-only psql -h 127.0.0.1 -U cleaning_migrator -d cleaning -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE cleaning TO cleaning_app;"
      - name: Lint and typecheck
        working-directory: backend
        run: |
          ~/.local/bin/uv run ruff check .
          ~/.local/bin/uv run ruff format --check .
          ~/.local/bin/uv run mypy app
      - name: Test
        working-directory: backend
        run: ~/.local/bin/uv run pytest

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleaning_migrator
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: cleaning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleaning_migrator -d cleaning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      OPERATIONAL_TIMEZONE: America/New_York
      RESERVATION_PROVIDER: mock
      SMS_PROVIDER: mock
      ROUTING_PROVIDER: mock
      AUTH_PROVIDER: mock
      PRODUCTION_INTEGRATIONS_ENABLED: "false"
      PRODUCTION_DISPATCH_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg://cleaning_app:local-dev-only@127.0.0.1:5432/cleaning
      MIGRATION_DATABASE_URL: postgresql+psycopg://cleaning_migrator:local-dev-only@127.0.0.1:5432/cleaning
      REDIS_URL: redis://127.0.0.1:6379/1
      AUTH_ISSUER: http://localhost/mock-issuer
      AUTH_AUDIENCE: cleaning-local
      AUTH_MOCK_SECRET: test-only-mock-secret-not-a-credential
      POLICY_APPROVAL_REQUIRED: "true"
      CORS_ORIGINS: http://127.0.0.1:3000
      HOSPITABLE_CREDENTIAL_SECRET_REF: ""
      HOSPITABLE_WEBHOOK_SECRET_REF: ""
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_MESSAGING_SERVICE_SID: ""
      GOOGLE_MAPS_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install uv and migrate
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          PGPASSWORD=local-dev-only psql -h 127.0.0.1 -U cleaning_migrator -d cleaning -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cleaning_app') THEN CREATE ROLE cleaning_app LOGIN PASSWORD 'local-dev-only'; END IF; END \$\$;"
          PGPASSWORD=local-dev-only psql -h 127.0.0.1 -U cleaning_migrator -d cleaning -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE cleaning TO cleaning_app;"
          cd backend
          ~/.local/bin/uv sync --frozen --all-groups
          ~/.local/bin/uv run alembic upgrade head
          ~/.local/bin/uv run python -m app.seed
          ~/.local/bin/uv run python -m tests.seed_browser
      - name: Install and check
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npx next build
          npx playwright install --with-deps chromium
          cd ../backend
          ~/.local/bin/uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/health/live && break; sleep 1; done
          cd ../frontend
          npm run test:e2e
      - name: Isolated local demo acceptance
        env:
          APP_ENV: development
          LOCAL_DEMO: "1"
          DATABASE_URL: postgresql+psycopg://cleaning_app:local-dev-only@127.0.0.1:5432/cleaning_demo
          MIGRATION_DATABASE_URL: postgresql+psycopg://cleaning_migrator:local-dev-only@127.0.0.1:5432/cleaning_demo
          REDIS_URL: redis://127.0.0.1:6379/7
          CLEANING_API_ORIGIN: http://127.0.0.1:8108
        run: |
          PGPASSWORD=local-dev-only createdb -h 127.0.0.1 -U cleaning_migrator -O cleaning_migrator cleaning_demo
          cd backend
          ~/.local/bin/uv run alembic upgrade head
          ~/.local/bin/uv run python -m app.demo.seed
          ~/.local/bin/uv run uvicorn app.demo.server:factory --factory --host 127.0.0.1 --port 8108 > /tmp/demo-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8108/v1/health/ready && break; sleep 1; done
          cd ../frontend
          npx playwright test tests/demo.spec.ts

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python runtime dependencies
        working-directory: backend
        env:
          UV_HTTP_TIMEOUT: "30"
        run: |
          python -m pip install --timeout 30 --retries 2 uv==0.13.7 pip-audit==2.10.1
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          pip-audit --no-deps --disable-pip --requirement /tmp/runtime-requirements.txt --timeout 15 --progress-spinner off
      - name: Audit JavaScript runtime dependencies
        working-directory: frontend
        run: |
          npm ci --fetch-timeout=30000 --fetch-retries=2
          npm audit --omit=dev --fetch-timeout=30000 --fetch-retries=2
